[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetpm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "joblib",
    "mlflow",
    "numpy",
    "pandas",
    "plotly",
    "PyYAML",
    "scikit-learn",
    "scipy",
    "shap",
    "streamlit",
    "torch",
    "xgboost",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]